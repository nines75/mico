name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          run_install: true
          cache: true

      - name: Check
        run: pnpm check

      - name: Build
        run: pnpm zip

      - name: Generate URL
        id: generate_url
        run: |
          git fetch --tags -f
          PREVIOUS_TAG=$(git tag | sort -V --reverse | sed -n 2p)
          echo "url=https://github.com/${{ github.repository }}/compare/$PREVIOUS_TAG...${{ github.ref_name }}" >> $GITHUB_OUTPUT

      - name: Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: .output/firefox.xpi
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body: |
            **Full Changelog**: ${{ steps.generate_url.outputs.url }}

      - name: Submit
        run: |
          pnpm wxt submit \
          --firefox-zip .output/firefox.xpi \
          --firefox-sources-zip .output/*-sources.zip
        env:
          FIREFOX_EXTENSION_ID: ${{ secrets.FIREFOX_EXTENSION_ID }}
          FIREFOX_JWT_ISSUER: ${{ secrets.FIREFOX_JWT_ISSUER }}
          FIREFOX_JWT_SECRET: ${{ secrets.FIREFOX_JWT_SECRET }}
